name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Build Android Project
        run: |
          # পুরো রিপোজিটরিতে gradlew ফাইলটি কোথায় আছে তা খুঁজে বের করবে
          GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ Error: gradlew file not found anywhere in the repository!"
            exit 1
          fi
          
          # গ্র্যাডল ফাইলের মেইন ফোল্ডারে প্রবেশ করা
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          
          echo "📂 Found project in: $PROJECT_DIR"
          chmod +x gradlew
          
          echo "🚀 Starting Gradle Build..."
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: floating-window-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
