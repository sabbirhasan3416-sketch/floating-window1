name: Android Overlay Build Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Launch Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install System Gradle & Regenerate Wrapper
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          # Regenerate gradle wrapper files to bypass any missing gradle-wrapper.jar errors
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Debug Android Package (APK)
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate Compiled Artifact
        run: |
          echo "Listing generated APK deliverables:"
          find app/build/outputs/apk/ -name "*.apk"

      - name: Create Workstation Deployment Uploads
        uses: actions/upload-artifact@v4
        with:
          name: floating-overlay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Generate Dynamic Tags and Release Meta
        id: meta
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Push Git Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Floating Window Release ${{ env.TAG_NAME }}
          body: |
            Automatic GitHub Actions compilation deliverable.
            
            ### Features Built in this Release:
            - **Premium Cosmic Dark UI**: Stunning dark background with pulsing service status lights.
            - **Multitask Overlay Window**: Smooth drag gestures, minimize-to-bubble, and system activity monitoring.
            - **Inline Sticky Pad**: Easy notes jotting with a toggle window input system.
            - **Hardware diagnostics**: Displays CPU/RAM uptime telemetry seamlessly above other apps.
            
            ### Package Asset downloads:
            Download **`app-debug.apk`** below to run it directly on your Android device.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
